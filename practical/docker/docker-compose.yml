version: '3.8'

services:
  db:
    image: postgres:15
    ports:
      - "5432:5432"  # 포트 포워딩 설정
    environment:
      POSTGRES_USER: root   # PostgreSQL 사용자명
      POSTGRES_PASSWORD: password  # PostgreSQL 비밀번호
      POSTGRES_DB: test  # 생성할 데이터베이스 이름
    volumes:
      - postgres_data:/var/lib/postgresql/data  # 데이터 유지용 볼륨 설정

volumes:
  postgres_data: